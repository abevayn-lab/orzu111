<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#100c08"><title>ORZU — Menyu</title><meta name="description" content="ORZU restorani taomlari va narxlari. Faqat menyuni ko‘rish uchun.">
<style>
:root{color-scheme:dark;--bg:#100c08;--panel:#21170f;--line:#65471f;--gold:#f0ce83;--muted:#c5b18d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -10%,#503318 0,#17100a 42%,#090706 85%);color:#fff8eb;font:16px Arial,sans-serif;min-height:100vh}.hero{text-align:center;padding:28px 14px 20px}.brand{font-size:40px;font-weight:900;letter-spacing:7px;color:var(--gold);text-shadow:0 2px 22px #b87b2c}.subtitle{margin-top:7px;color:#e8d4ae;letter-spacing:3px;font-size:12px}.notice{max-width:1100px;margin:0 auto 12px;padding:0 14px;color:var(--muted);font-size:12px;text-align:center}.tabs{position:sticky;top:0;z-index:5;display:flex;gap:8px;overflow-x:auto;padding:12px;background:#100d0bed;border-block:1px solid #60451e;scrollbar-width:none}.tab{white-space:nowrap;border:1px solid #80602b;border-radius:22px;background:#21170e;color:#f8dfa2;padding:10px 16px;font-weight:700}.tab.on{background:linear-gradient(110deg,#ffe18d,#d58e20);color:#241606}.wrap{max-width:1100px;margin:auto;padding:14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:14px}.card{overflow:hidden;border:1px solid #755326;border-radius:17px;background:linear-gradient(145deg,#291b10,#100c09);box-shadow:0 8px 22px #0008}.im{height:165px;background:#1b130b}.im img{width:100%;height:100%;object-fit:cover;display:block}.details{padding:14px}.name{font-size:17px;font-weight:700;color:#fff2d3;line-height:1.35;min-height:42px}.price{margin-top:10px;color:var(--gold);font-weight:900;font-size:18px}.empty{text-align:center;color:var(--muted);padding:45px 10px;grid-column:1/-1}.foot{text-align:center;color:#9c8969;font-size:12px;padding:25px 12px 35px}@media(max-width:520px){.hero{padding-top:20px}.brand{font-size:34px}.wrap{padding:10px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.im{height:125px}.details{padding:10px}.name{font-size:14px;min-height:38px}.price{font-size:16px}}
</style></head><body>
<header class="hero"><div class="brand">ORZU</div><div class="subtitle">RESTORAN · MENYU</div></header>
<div class="notice">Menyudagi taomlar va narxlar bilan tanishing. Bu sahifa faqat ko‘rish uchun — bu yerdan buyurtma berib bo‘lmaydi.</div>
<nav class="tabs" id="tabs" aria-label="Menyu bo‘limlari"></nav>
<main class="wrap"><section class="grid" id="items"><div class="empty">Menyu yuklanmoqda…</div></section></main>
<footer class="foot">ORZU RESTORANI</footer>
<script>
const tabs=document.getElementById('tabs'),items=document.getElementById('items');let cats=[],menu=[],active=0;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n||0).toLocaleString('uz-UZ')+" so‘m";
function renderTabs(){tabs.innerHTML=cats.map((c,i)=>'<button class="tab '+(i===active?'on':'')+'" type="button" data-i="'+i+'">'+esc(c)+'</button>').join('');}
function renderItems(){const list=menu.filter(m=>Number(m.cat)===active);items.innerHTML=list.length?list.map(m=>{const src=/^https?:\/\//i.test(String(m.img||''))?m.img:'/';return '<article class="card"><div class="im"><img loading="lazy" src="'+esc(src)+'" alt="'+esc(m.name)+'" onerror="this.style.display=\'none\'"></div><div class="details"><div class="name">'+esc(m.name)+'</div><div class="price">'+money(m.price)+'</div></div></article>'}).join(''):'<div class="empty">Bu bo‘limda hozircha taom yo‘q.</div>';}
tabs.addEventListener('click',e=>{const b=e.target.closest('button[data-i]');if(!b)return;active=Number(b.dataset.i);renderTabs();renderItems();});
async function init(){try{const r=await fetch('/api/menu',{cache:'no-store'});if(!r.ok)throw Error('Menyu olinmadi');const d=await r.json();cats=d.cats||[];menu=d.menu||[];renderTabs();renderItems();}catch(e){items.innerHTML='<div class="empty">Menyuni yuklab bo‘lmadi. Sahifani yangilang.</div>';}}
init();
</script></body></html>
