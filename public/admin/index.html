<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
  <title>ORZU — Admin</title>
  <meta name="theme-color" content="#111014">

  <link rel="stylesheet" href="/style.css">
  <style>
    :root {
      --g: #f4c65e;
      --g2: #ffe39a;
      --dark: #120e0a;
    }
    * { box-sizing: border-box; }
    body {
      background: radial-gradient(ellipse at 50% -18%, #5a3718 0, #21150c 32%, #080706 76%) fixed;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
      margin: 0;
      padding-bottom: 120px;
    }
    .staff-portal-bar {
      background: rgba(18, 14, 10, 0.92);
      border-bottom: 1px solid rgba(212, 175, 55, 0.3);
      padding: 6px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #d8c29d;
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .staff-links {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .staff-link {
      color: #ffe39a;
      text-decoration: none;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(255, 227, 154, 0.1);
      border: 1px solid rgba(212, 175, 55, 0.25);
      white-space: nowrap;
      transition: all 0.2s;
    }
    .staff-link:hover, .staff-link.active {
      background: rgba(255, 227, 154, 0.25);
      border-color: #d4af37;
    }
    .hero {
      text-align: center;
      padding: 24px 12px 14px;
    }
    .hero .crown { font-size: 44px; color: var(--g2); }
    .hero h1 { font: bold 38px Georgia, serif; margin: 0; color: var(--g2); }
    .hero p { font-size: 11px; letter-spacing: 5px; color: #fff0c9; margin: 4px 0 0; }
    .wrap { max-width: 650px; margin: auto; padding: 0 14px; }
    .stat, .card {
      background: linear-gradient(125deg, #2b1c10, #17100b 60%, #100c09);
      border: 1px solid #956b31;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 14px;
    }
    .profilebar {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px;
      margin-bottom: 14px;
      border-radius: 22px;
      border: 1px solid #956b31;
      background: linear-gradient(125deg, #2b1c10, #100c09);
    }
    .profilebadge {
      width: 60px;
      height: 60px;
      border: 2px solid #d8a84b;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 32px;
      color: #ffe39a;
      background: #25190e;
    }
    .home-stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin: 14px 0;
    }
    .home-stat {
      padding: 14px 8px;
      text-align: center;
      border: 1px solid #956b31;
      border-radius: 18px;
      background: linear-gradient(125deg, #2b1c10, #100c09);
    }
    .home-stat span { display: block; color: #d8c29d; font-size: 12px; min-height: 28px; }
    .home-stat b { display: block; color: var(--g2); font-size: 19px; margin-top: 4px; }
    .home-action {
      width: 100%;
      border: 0;
      border-radius: 28px;
      padding: 16px;
      margin: 6px 0 16px;
      background: linear-gradient(110deg, #ffe58d, #f6bd42 55%, #bd7a17);
      color: #241606;
      font-weight: 900;
      font-size: 16px;
      cursor: pointer;
    }
    .btn {
      border-radius: 28px;
      padding: 11px 18px;
      font-weight: 800;
      border: 1px solid #f5d47f;
      background: linear-gradient(110deg, #ffe18d, #d58e20);
      color: #241606;
      cursor: pointer;
    }
    .btn.sm { padding: 6px 12px; font-size: 12px; }
    .btn.red { background: #7a1f1f; color: #fff; border-color: #a83232; }
    .quick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    /* Pastki navigatsiya: bo‘limlar bir qatorda chapdan o‘ngga joylashadi. */
    #bottomNav {
      position: fixed;
      z-index: 10000;
      left: 8px; right: 8px; bottom: calc(10px + env(safe-area-inset-bottom));
      display: flex; flex-direction: row; flex-wrap: nowrap; justify-content: flex-start; align-items: center;
      overflow-x: auto; overflow-y: hidden; scrollbar-width: none; -webkit-overflow-scrolling: touch;
      gap: 6px; padding: 8px 10px;
      min-height: 58px; border-radius: 16px;
      background: rgba(16, 12, 9, 0.98); border: 1px solid #956b31;
      box-shadow: 0 8px 28px rgba(0,0,0,.55); backdrop-filter: blur(12px);
    }
    #bottomNav::-webkit-scrollbar { display: none; }
    #bottomNav .navitem {
      flex: 0 0 auto;
      min-width: max-content;
      border: 1px solid rgba(149, 107, 49, 0.45);
      border-radius: 12px;
      background: rgba(255, 227, 154, 0.06);
      color: #c8b99f;
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 7px;
      white-space: nowrap;
      padding: 9px 13px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    #bottomNav .navitem b { font-size: 18px; line-height: 1; color: #e5bd6d; }
    #bottomNav .navitem.active { color: #ffe39a; }
    #bottomNav .navitem.active b { color: #ffe39a; text-shadow: 0 0 12px #e8b94b; }
    input, select {
      background: #0f0f12;
      border: 1px solid #755326;
      color: #fff;
      border-radius: 12px;
      padding: 12px;
      width: 100%;
      margin: 6px 0 10px;
      font-size: 15px;
    }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 10px 8px; border-bottom: 1px solid #4a341b; font-size: 13px; text-align: left; }
    th { color: var(--g2); }
    .thumb { width: 50px; height: 50px; object-fit: cover; border-radius: 10px; border: 1px solid #755326; }
    .badge { padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 800; }
    .badge.new { background: #d4af37; color: #000; }
    .badge.accepted { background: #174e8b; color: #fff; }
    .badge.served { background: #95500b; color: #fff; }
    .badge.paid { background: #1c642b; color: #fff; }
  
    /* ORZU: each role opens as its own standalone app */
    .staff-portal-bar { display: none !important; }
  
    /* Native-app feel: prevent accidental double-tap/pinch zoom and rubber-band page drift. */
    html { touch-action: pan-y manipulation; overscroll-behavior-y: none; -webkit-text-size-adjust: 100%; }
    body { overscroll-behavior-y: none; }
    button, a, input, select, textarea { touch-action: manipulation; }
  </style>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ORZU Admin">
  <link rel="manifest" href="/admin-manifest.webmanifest">
  <link rel="icon" href="/admin-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/admin-icon.svg">
</head>
<body>

  <!-- Staff Portal Bar -->

<div class="hero">
    <div class="crown">♛</div>
    <h1>ORZU</h1>
    <p>A D M I N · B O S H Q A R U V</p>
  </div>

  <div class="wrap" id="app"></div>
  <nav id="bottomNav" aria-label="Admin menyu"></nav>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    let P = localStorage.getItem('ap') || '';
    let D = { cats: [], categoryStations: {}, menu: [], waiters: [], orders: [], history: [] };
    let tab = 0;
    let img = '';
    let edit = null;
    let knownOrderIds = null;
    let statsCatFilter = 'all';

    const f = n => Number(n || 0).toLocaleString('uz-UZ') + " so'm";
    const TABS = ['Bosh sahifa', 'Buyurtmalar', 'Menyu', 'Ofitsiantlar', 'Statistika', 'Stol QR', 'Bo‘limlar'];

    const encodeHeaderSecret = value => btoa(String.fromCharCode(...new TextEncoder().encode(String(value || ''))));
    const H = () => ({ 'Content-Type': 'application/json', 'x-admin': encodeHeaderSecret(P) });

    async function api(u, m = 'GET', b) {
      const r = await fetch(u, {
        method: m,
        headers: H(),
        body: b ? JSON.stringify(b) : undefined
      });
      if (r.status === 401) {
        localStorage.removeItem('ap');
        P = '';
        login();
        throw new Error('Parol noto‘g‘ri');
      }
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || 'So‘rov bajarilmadi');
      return data;
    }

    function login() {
      bottomNav.style.display = 'none';
      app.innerHTML = `
        <div class="stat" style="max-width:380px;margin:30px auto">
          <h2 class="gold" style="margin-top:0">Admin kirishi</h2>
          <p style="color:#d8c29d;font-size:13px">Admin parolini kiriting:</p>
          <input id="pw" type="password" placeholder="Admin paroli" autofocus>
          <button class="btn" style="width:100%;margin-top:8px" onclick="doLogin()">Kirish</button>
        </div>
      `;
      document.getElementById('pw')?.addEventListener('keydown', e => {
        if (e.key === 'Enter') doLogin();
      });
    }

    function doLogin() {
      const pwInput = document.getElementById('pw');
      if (!pwInput) return;
      P = pwInput.value.trim();
      localStorage.setItem('ap', P);
      load();
    }

    async function load(bg) {
      if (!P) return login();
      try {
        D = await api('/api/admin/data');
        bottomNav.style.display = 'flex';
        if (bg && (tab === 2 || tab === 5 || tab === 6 || /^(INPUT|SELECT|TEXTAREA)$/.test((document.activeElement || {}).tagName || ''))) return;
        render();
      } catch (e) {
        // Handled in api()
      }
    }

    function render() {
      const nav = [
        ['⌂', 'Bosh sahifa', 0],
        ['▣', 'Buyurtmalar', 1],
        ['＋', 'Menyu', 2],
        ['♙', 'Ofitsiantlar', 3],
        ['▤', 'Statistika', 4],
        ['▦', 'Stol QR', 5],
        ['☷', 'Bo‘limlar', 6]
      ];
      bottomNav.innerHTML = nav.map(x => `
        <button class="navitem ${tab === x[2] ? 'active' : ''}" onclick="tab=${x[2]};render()">
          <b>${x[0]}</b>
          <span>${x[1]}</span>
        </button>
      `).join('');

      const views = [home, orders, menu, waiters, stats, tableQrs, categories];
      app.innerHTML = views[tab] ? views[tab]() : home();
    }

    const tbl = (h, r) => `
      <div style="overflow-x:auto">
        <table>
          <tr>${h.map(x => `<th>${x}</th>`).join('')}</tr>
          ${r.map(x => `<tr>${x.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}
        </table>
      </div>
    `;

    function home() {
      const all = D.history || D.orders || [];
      const since = Number(D.statsResetAt || 0);
      const paid = all.filter(o => Number(o.time || 0) >= since && o.status === 'paid');
      const sum = paid.reduce((n, o) => n + Number(o.total || 0), 0);
      const fresh = (D.orders || []).filter(o => o.status === 'new').length;

      return `
        <div class="profilebar">
          <div class="profilebadge">♛</div>
          <div>
            <b style="font-size:18px;color:var(--g2)">ORZU ADMIN</b>
            <small style="color:#d8c29d;display:block">Restoran to‘liq boshqaruvi</small>
            <span style="color:#54e56c;font-size:12px;font-weight:700">● Tizim faol</span>
          </div>
        </div>
        <div class="home-stats">
          <div class="home-stat">
            <span>To‘langan</span>
            <b>${paid.length} ta</b>
          </div>
          <div class="home-stat">
            <span>Jami savdo</span>
            <b style="font-size:16px">${f(sum)}</b>
          </div>
          <div class="home-stat">
            <span>Yangi buyurtma</span>
            <b>${fresh} ta</b>
          </div>
        </div>
        <button class="home-action" onclick="tab=1;render()">
          ▣　Buyurtmalarni ko‘rish (${fresh} ta yangi)　›
        </button>
        <div class="stat">
          <h3 class="gold" style="margin-top:0">Tezkor bo‘limlar</h3>
          <div class="quick-grid">
            <button class="btn" onclick="tab=2;render()">＋ Menyu boshqaruvi</button>
            <button class="btn" onclick="tab=3;render()">＋ Ofitsiantlar</button>
            <button class="btn" onclick="tab=4;render()">▤ To‘liq hisobot</button>
            <button class="btn" onclick="tab=6;render()">📂 Bo‘limlar (Kategoriyalar)</button>
          </div>
        </div>
      `;
    }

    function orders() {
      const list = (D.orders || []).slice().sort((a, b) => b.time - a.time);
      return `
        <div class="stat">
          <h2 class="gold" style="margin-top:0">Buyurtmalar ro‘yxati</h2>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
            <span>Jami: <b>${list.length} ta</b></span>
            <button class="btn sm" onclick="load()">↻ Yangilash</button>
          </div>
          ${list.length ? tbl(
            ['#', 'Stol', 'Ofitsiant', 'Summa', 'Holat', 'Vaqt'],
            list.map(o => [
              o.id,
              o.table,
              o.waiterName || '—',
              f(o.total),
              `<span class="badge ${o.status}">${o.status}</span>`,
              new Date(o.time).toLocaleTimeString('uz-UZ', { hour: '2-digit', minute: '2-digit' })
            ])
          ) : '<p style="text-align:center;color:#c0b5a3;padding:20px">Buyurtmalar mavjud emas</p>'}
        </div>
      `;
    }

    function menu() {
      return `
        <div class="stat">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <h3 class="gold" style="margin:0">${edit ? 'Taomni tahrirlash' : 'Yangi taom qo‘shish'}</h3>
            <button class="btn sm" onclick="tab=6;render()">📂 Bo‘limlar</button>
          </div>
          <input id="mn" placeholder="Taom nomi (masalan: Manti)" value="${edit ? edit.name : ''}">
          <input id="mp" type="number" placeholder="Narxi so‘mda (masalan: 35000)" value="${edit ? edit.price : ''}">
          <label style="font-size:12px;color:#d8c29d">Bo‘limni tanlang:</label>
          <select id="mc">
            ${D.cats.map((c, i) => `<option value="${i}" ${edit && edit.cat == i ? 'selected' : ''}>${c}</option>`).join('')}
          </select>
          <label for="mifile" style="display:block;margin-top:12px;font-size:13px;color:#d8c29d">Taom rasmi (telefon galereyasidan tanlang):</label>
          <input id="mifile" type="file" accept="image/*" onchange="previewMenuImage(this)" style="width:100%;padding:10px;background:#242424;color:#fff;border:1px solid #806b48;border-radius:8px">
          <div style="display:flex;align-items:center;gap:12px;margin-top:8px">
            <img id="mipreview" src="${edit && typeof edit.img === 'string' && edit.img.startsWith('data:image/') ? edit.img : ''}" alt="Tanlangan taom rasmi" style="width:88px;height:72px;object-fit:cover;border-radius:8px;border:1px solid #806b48;${edit && typeof edit.img === 'string' && edit.img.startsWith('data:image/') ? '' : 'display:none'}">
            <small style="color:#aaa">Rasm tanlang yoki avvalgi rasmni o‘zgarishsiz qoldiring.</small>
          </div>
          <div style="display:flex;gap:10px;margin-top:10px">
            <button class="btn" style="flex:1" onclick="saveM()">✓ Saqlash</button>
            ${edit ? '<button class="btn red" onclick="edit=null;render()">Bekor qilish</button>' : ''}
          </div>
        </div>
        <div class="stat">
          <h3 class="gold" style="margin-top:0">Mavjud menyu (${D.menu.length} ta)</h3>
          ${tbl(
            ['Rasm', 'Nomi', 'Narx', 'Bo‘lim', 'Amallar'],
            D.menu.map(m => [
              typeof m.img === 'string' && m.img.startsWith('data:image/')
                ? `<img class="thumb" src="${m.img}" alt="${m.name}">`
                : '<div class="thumb" style="display:flex;align-items:center;justify-content:center;background:#242424;color:#999;font-size:10px;text-align:center">Rasm yo‘q</div>',
              m.name,
              f(m.price),
              D.cats[m.cat] || 'Boshqa',
              `<button class="btn sm" onclick="ed(${m.id})">✎</button> <button class="btn sm red" onclick="delM(${m.id})">✕</button>`
            ])
          )}
        </div>
      `;
    }

    function previewMenuImage(input) {
      const file = input.files && input.files[0];
      const preview = document.getElementById('mipreview');
      if (!file || !preview) return;
      if (!file.type.startsWith('image/')) {
        input.value = '';
        return alert('Faqat rasm faylini tanlang.');
      }
      if (file.size > 8 * 1024 * 1024) {
        input.value = '';
        return alert('Rasm hajmi 8 MB dan oshmasin.');
      }
      preview.src = URL.createObjectURL(file);
      preview.style.display = 'block';
    }

    function compressMenuImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('Rasmni o‘qib bo‘lmadi.'));
        reader.onload = () => {
          const image = new Image();
          image.onerror = () => reject(new Error('Rasm fayli ochilmadi.'));
          image.onload = () => {
            const maxSide = 1000;
            const scale = Math.min(1, maxSide / Math.max(image.width, image.height));
            const canvas = document.createElement('canvas');
            canvas.width = Math.max(1, Math.round(image.width * scale));
            canvas.height = Math.max(1, Math.round(image.height * scale));
            const ctx = canvas.getContext('2d');
            if (!ctx) return reject(new Error('Rasmni tayyorlab bo‘lmadi.'));
            ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', 0.78));
          };
          image.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function saveM() {
      const name = mn.value.trim();
      const price = Number(mp.value);
      if (!name || !price) return alert('Nom va narxni kiriting!');
      const saveButton = document.querySelector('button[onclick="saveM()"]');
      if (saveButton) { saveButton.disabled = true; saveButton.textContent = 'Saqlanmoqda...'; }
      try {
        const selectedFile = document.getElementById('mifile').files[0];
        const img = selectedFile ? await compressMenuImage(selectedFile) : (edit && typeof edit.img === 'string' && edit.img.startsWith('data:image/') ? edit.img : '');
        await api('/api/admin/menu', 'POST', {
          id: edit && edit.id,
          name,
          price,
          cat: mc.value,
          img
        });
        edit = null;
        await load();
        alert('Taom muvaffaqiyatli saqlandi!');
      } catch (error) {
        alert('Taom saqlanmadi: ' + (error.message || error));
        if (saveButton) { saveButton.disabled = false; saveButton.textContent = '✓ Saqlash'; }
      }
    }

    function ed(id) {
      edit = D.menu.find(m => m.id == id);
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function delM(id) {
      if (!confirm('Taomni menyudan o‘chirasizmi?')) return;
      await api('/api/admin/menu/' + id, 'DELETE');
      await load();
    }

    function tableQrs() {
      return `
        <div class="stat">
          <h3 class="gold" style="margin-top:0">Stollar uchun QR kodlar</h3>
          <p style="color:#d8c29d;font-size:13px">Har bir stolga alohida QR kod yarating. Mijoz telefonida skanerlab menyuni ochadi va stol raqami avtomatik belgilanadi.</p>
          <label for="qrTable" style="display:block;margin:12px 0 6px">Stol raqami</label>
          <input id="qrTable" maxlength="20" value="1" placeholder="Masalan: 1 yoki VIP-1">
          <button class="btn" style="width:100%" onclick="makeTableQr()">QR kod yaratish</button>
          <div id="qrResult" style="margin-top:18px"></div>
        </div>
      `;
    }

    async function makeTableQr() {
      const table = document.getElementById('qrTable').value.trim();
      if (!table) return alert('Stol raqamini kiriting');
      const result = document.getElementById('qrResult');
      result.innerHTML = '<p style="color:#d8c29d">QR kod tayyorlanmoqda...</p>';
      try {
        const data = await api('/api/admin/table-qr/' + encodeURIComponent(table));
        if (!data.url) throw new Error(data.error || 'QR havola olinmadi');
        result.innerHTML = `
          <div style="background:#fff;color:#17100a;border-radius:12px;padding:16px;text-align:center">
            <h3 style="margin:0 0 12px">ORZU — STOL ${String(data.table).replace(/[&<>"']/g, '')}</h3>
            <div id="qrCanvas" style="display:flex;justify-content:center;min-height:220px;align-items:center"></div>
            <p style="font-size:11px;word-break:break-all;margin:12px 0">${data.url}</p>
            <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
              <button class="btn" onclick="copyTableQr()">Havolani nusxalash</button>
              <button class="btn" onclick="printTableQr()">QR kodni chop etish</button>
            </div>
          </div>
        `;
        window.currentTableQrUrl = data.url;
        window.currentTableQrTable = data.table;
        if (window.QRCode) {
          new QRCode(document.getElementById('qrCanvas'), { text: data.url, width: 210, height: 210, correctLevel: QRCode.CorrectLevel.M });
        } else {
          document.getElementById('qrCanvas').innerHTML = '<p style="color:#9b2c2c">QR kutubxonasi yuklanmadi. Internetni tekshirib qayta urinib ko‘ring.</p>';
        }
      } catch (e) {
        result.innerHTML = '';
        alert('QR yaratilmadi: ' + (e.message || e));
      }
    }

    async function copyTableQr() {
      if (!window.currentTableQrUrl) return;
      try { await navigator.clipboard.writeText(window.currentTableQrUrl); alert('QR havolasi nusxalandi'); }
      catch { prompt('QR havolasini nusxalang:', window.currentTableQrUrl); }
    }

    function printTableQr() {
      const url = window.currentTableQrUrl;
      if (!url) return;
      const table = window.currentTableQrTable || '';
      const canvas = document.querySelector('#qrCanvas canvas');
      const image = document.querySelector('#qrCanvas img');
      const src = canvas ? canvas.toDataURL('image/png') : (image ? image.src : '');
      if (!src) return alert('QR rasmi hali tayyor emas');
      const w = window.open('', '_blank', 'width=500,height=650');
      if (!w) return alert('Chop etish oynasi bloklandi. Brauzerda pop-upga ruxsat bering.');
      w.document.write('<!doctype html><html><head><title>ORZU stol QR</title><style>body{font-family:Arial;text-align:center;padding:30px}img{width:280px;height:280px}h1{font-size:26px}</style></head><body><h1>ORZU RESTORANI</h1><h2>STOL ' + String(table).replace(/[&<>"']/g, '') + '</h2><img src="' + src + '"><p>Menyuni ko‘rish va buyurtma berish uchun skanerlang</p></body></html>');
      w.document.close(); w.focus(); w.print();
    }

    function categories() {
      return `
        <div class="stat">
          <h3 class="gold" style="margin-top:0">Menyu bo‘limlari tartibi</h3>
          <p style="color:#d8c29d;font-size:13px">Bu yerdagi ketma-ketlik mijoz telefonidagi menyuda ham xuddi shunday ko‘rinadi. Yuqoriga/pastga tugmalari bilan joyini o‘zgartiring.</p>
          <div style="display:grid;gap:8px">
            ${D.cats.map((x, i) => `
              <div style="display:flex;align-items:center;gap:8px;padding:10px;border:1px solid #4a341b;border-radius:12px;background:#17100b">
                <b style="min-width:24px;color:var(--g2)">${i + 1}.</b>
                <span style="flex:1;font-weight:700">${x}</span>
                <select aria-label="${x} ish joyi" onchange="setCategoryStation(${i},this.value)" style="max-width:145px;padding:7px;background:#242424;color:#fff;border:1px solid #806b48;border-radius:8px">
                  <option value="waiter" ${(D.categoryStations||{})[x]==='waiter'?'selected':''}>Ofitsiant</option>
                  <option value="oshpaz" ${(D.categoryStations||{})[x]==='oshpaz'?'selected':''}>Oshpaz</option>
                  <option value="salatchi" ${(D.categoryStations||{})[x]==='salatchi'?'selected':''}>Salatchi</option>
                  <option value="somsachi" ${(D.categoryStations||{})[x]==='somsachi'?'selected':''}>Somsachi</option>
                </select>
                <button class="btn sm" ${i === 0 ? 'disabled' : ''} onclick="moveCategory(${i},-1)" aria-label="Yuqoriga">↑</button>
                <button class="btn sm" ${i === D.cats.length - 1 ? 'disabled' : ''} onclick="moveCategory(${i},1)" aria-label="Pastga">↓</button>
                <button class="btn sm red" onclick="removeCategory(${i})">O‘chirish</button>
              </div>
            `).join('')}
          </div>
        </div>
        <div class="stat">
          <h3 class="gold" style="margin-top:0">Yangi menyu bo‘limi qo‘shish</h3>
          <p style="color:#d8c29d;font-size:13px">Masalan: 1-taom, 2-taom, Salatlar, Ichimliklar.</p>
          <input id="cn" maxlength="40" placeholder="Bo‘lim nomi">
          <label style="display:block;margin:10px 0 6px;color:#d8c29d;font-size:13px">Qaysi ish joyiga yuborilsin?</label>
          <select id="cstation">
            <option value="waiter" selected>Ofitsiant (standart)</option>
            <option value="oshpaz">Oshpaz</option>
            <option value="salatchi">Salatchi</option>
            <option value="somsachi">Somsachi</option>
          </select>
          <button class="btn" onclick="addCategory()">+ Bo‘lim qo‘shish</button>
        </div>
      `;
    }

    async function moveCategory(index, direction) {
      const order = D.cats.slice();
      const target = index + direction;
      if (target < 0 || target >= order.length) return;
      [order[index], order[target]] = [order[target], order[index]];
      try {
        const result = await api('/api/admin/categories/reorder', 'POST', { order });
        if (result.error) throw new Error(result.error);
        D.cats = result.cats;
        await load();
        tab = 6;
        render();
      } catch (error) {
        alert('Bo‘lim tartibi saqlanmadi: ' + error.message);
      }
    }

    async function setCategoryStation(index, station) {
      try {
        const r = await api('/api/admin/category/station', 'POST', { index, station });
        if (r.error) throw new Error(r.error);
        D.categoryStations = r.categoryStations || D.categoryStations;
      } catch (error) {
        alert('Ish joyi saqlanmadi: ' + error.message);
        await load();
        tab = 6;
        render();
      }
    }

    async function addCategory() {
      const name = cn.value.trim();
      const station = document.getElementById('cstation')?.value || 'waiter';
      if (!name) return alert('Bo‘lim nomini kiriting!');
      const r = await api('/api/admin/category', 'POST', { name, station });
      if (r.error) return alert(r.error);
      cn.value = '';
      await load();
      alert('Bo‘lim qo‘shildi!');
    }

    async function removeCategory(i) {
      const name = D.cats[i];
      if (!confirm('"' + name + '" bo‘limi o‘chirilsinmi? Undagi taomlar boshqa bo‘limga o‘tkaziladi.')) return;
      const r = await api('/api/admin/category/' + i, 'DELETE');
      if (r.error) return alert(r.error);
      await load();
    }

    function waiters() {
      const clock = t => t ? new Date(t).toLocaleTimeString('uz-UZ', { hour: '2-digit', minute: '2-digit' }) : '—';
      return `
        <div class="stat">
          <h3 class="gold" style="margin-top:0">Ofitsiant qo‘shish</h3>
          <input id="wn" placeholder="Ofitsiant ismi (masalan: Nodirbek)">
          <input id="wp" placeholder="PIN kod (masalan: 3333)">
          <button class="btn" onclick="addW()">+ Ofitsiantni saqlash</button>
        </div>
        <div class="stat">
          <h3 class="gold" style="margin-top:0">Ofitsiantlar ro‘yxati (${D.waiters.length} ta)</h3>
          ${tbl(
            ['Ism', 'PIN', 'Holati', 'Ish boshladi', 'Amal', ''],
            D.waiters.map(w => {
              const sh = w.shift || {};
              return [
                w.name,
                w.pin,
                `<span class="badge ${sh.online ? 'accepted' : 'served'}">${sh.online ? 'ONLAYN' : 'OFLAYN'}</span>`,
                clock(sh.onlineAt),
                `<button class="btn sm" onclick="toggleWaiter(${w.id})">${sh.online ? 'Oflayn qilish' : 'Onlayn qilish'}</button>`,
                `<button class="btn sm red" onclick="delW(${w.id})">✕</button>`
              ];
            })
          )}
        </div>
      `;
    }

    async function addW() {
      const name = wn.value.trim();
      const pin = wp.value.trim();
      if (!name || !pin) return alert('Ism va PIN kodni kiriting!');
      await api('/api/admin/waiter', 'POST', { name, pin });
      wn.value = '';
      wp.value = '';
      await load();
      alert('Ofitsiant qo‘shildi!');
    }

    async function delW(id) {
      if (!confirm('Ofitsiantni o‘chirasizmi?')) return;
      await api('/api/admin/waiter/' + id, 'DELETE');
      await load();
    }

    async function toggleWaiter(id) {
      const w = (D.waiters || []).find(x => String(x.id) === String(id));
      if (!w) return;
      const next = !(w.shift && w.shift.online);
      try {
        await api('/api/admin/waiter-presence', 'POST', { waiterId: id, online: next });
        await load();
        alert(w.name + (next ? ' Onlayn bo‘ldi' : ' Oflayn bo‘ldi'));
      } catch (e) {
        alert(e.message);
      }
    }

    function setStatsCategory(value) { statsCatFilter = value; render(); }
    function donutMarkup(rows, emptyText) {
      const data=rows.filter(x=>x.value>0).sort((a,b)=>b.value-a.value), total=data.reduce((n,x)=>n+x.value,0);
      if(!total)return '<p style="color:#c0b5a3">'+emptyText+'</p>';
      const colors=['#f4c65e','#65b7a8','#7c9de8','#d88ac7','#e58c58','#9cce70','#a78bfa','#e5d36c']; let cursor=0;
      const stops=data.map((x,i)=>{const start=cursor;cursor+=x.value/total*100;return colors[i%colors.length]+' '+start+'% '+cursor+'%';}).join(',');
      return '<div style="display:grid;grid-template-columns:minmax(130px,190px) 1fr;gap:16px;align-items:center"><div style="width:100%;max-width:190px;aspect-ratio:1;border-radius:50%;background:conic-gradient('+stops+');position:relative;margin:auto;display:grid;place-items:center"><div style="width:58%;height:58%;border-radius:50%;background:#17100b;display:grid;place-items:center;text-align:center"><b style="color:var(--g2);font-size:18px">'+total.toLocaleString('uz-UZ')+'</b><small style="color:#d8c29d">dona</small></div></div><div style="display:grid;gap:8px">'+data.map((x,i)=>'<div style="display:grid;grid-template-columns:12px 1fr auto;gap:7px;align-items:center;font-size:12px"><i style="width:10px;height:10px;border-radius:3px;background:'+colors[i%colors.length]+'"></i><span>'+String(x.label).replace(/[&<>"']/g,'')+'</span><b>'+x.value.toLocaleString('uz-UZ')+' ta · '+Math.round(x.value/total*100)+'%</b></div>').join('')+'</div></div>';
    }
    function stats() {
      const since = Number(D.statsResetAt || 0);
      const all = (D.history || D.orders || []).filter(o => Number(o.time || 0) >= since);
      const paid = all.filter(o => o.status === 'paid');
      const pending = all.filter(o => o.status !== 'paid');
      const totalSum = paid.reduce((n, o) => n + Number(o.total || 0), 0);
      const soldQty = paid.reduce((n, o) => n + (o.items || []).reduce((q, item) => q + Number(item.qty || 0), 0), 0);
      const average = paid.length ? Math.round(totalSum / paid.length) : 0;
      const byDish = {};
      const byWaiter = {};
      const byDay = {};
      paid.forEach(o => {
        (o.items || []).forEach(item => {
          const key = String(item.name || 'Noma’lum');
          if (!byDish[key]) byDish[key] = { qty: 0, sum: 0 };
          byDish[key].qty += Number(item.qty || 0);
          byDish[key].sum += Number(item.qty || 0) * Number(item.price || 0);
        });
        const waiter = String(o.waiterName || 'Noma’lum');
        if (!byWaiter[waiter]) byWaiter[waiter] = { count: 0, sum: 0 };
        byWaiter[waiter].count += 1;
        byWaiter[waiter].sum += Number(o.total || 0);
        const date = new Date(Number(o.paidAt || o.time || 0)).toLocaleDateString('uz-UZ');
        if (!byDay[date]) byDay[date] = { count: 0, sum: 0 };
        byDay[date].count += 1;
        byDay[date].sum += Number(o.total || 0);
      });
      const topDishes = Object.entries(byDish).sort((a,b) => b[1].qty-a[1].qty).slice(0,10);
      const categoryTotals = {}, dishTotalsByCategory = {};
      paid.forEach(o => (o.items || []).forEach(item => {
        const qty=Number(item.qty||0), matched=(D.menu||[]).find(m=>String(m.name).trim().toLowerCase()===String(item.name||'').trim().toLowerCase());
        const catName=D.cats[matched?Number(matched.cat):-1]||'Boshqa / menyudan o‘chirilgan';
        categoryTotals[catName]=(categoryTotals[catName]||0)+qty;
        if(!dishTotalsByCategory[catName])dishTotalsByCategory[catName]={};
        dishTotalsByCategory[catName][item.name]=(dishTotalsByCategory[catName][item.name]||0)+qty;
      }));
      const categoryRows=Object.entries(categoryTotals).map(([label,value])=>({label,value}));
      const selectedCategory=statsCatFilter==='all'?'':statsCatFilter;
      const selectedDishes=selectedCategory?Object.entries(dishTotalsByCategory[selectedCategory]||{}).map(([label,value])=>({label,value})):[];
      const categoryOptions=D.cats.map(name=>'<option value="'+String(name).replace(/"/g,'&quot;')+'" '+(statsCatFilter===name?'selected':'')+'>'+name+'</option>').join('');

      const waiterRows = Object.entries(byWaiter).sort((a,b) => b[1].sum-a[1].sum);
      const dayRows = Object.entries(byDay).sort((a,b) => {
        const [da,ma,ya] = a[0].split('.').map(Number);
        const [db,mb,yb] = b[0].split('.').map(Number);
        return new Date(yb,mb-1,db)-new Date(ya,ma-1,da);
      }).slice(0,14);
      return `
        <div class="stat">
          <h2 class="gold" style="margin-top:0">Umumiy statistika va hisobot</h2>
          <p style="color:#d8c29d;font-size:12px">Hisobot statistika oxirgi marta yangidan boshlangan vaqtdan hisoblanadi. Buyurtmalar tarixi saqlanadi.</p>
          <div class="home-stats">
            <div class="home-stat"><span>Jami buyurtmalar</span><b>${all.length} ta</b></div>
            <div class="home-stat"><span>To‘langan cheklar</span><b>${paid.length} ta</b></div>
            <div class="home-stat"><span>Kutilayotganlar</span><b>${pending.length} ta</b></div>
            <div class="home-stat"><span>Jami tushum</span><b style="font-size:16px">${f(totalSum)}</b></div>
            <div class="home-stat"><span>O‘rtacha chek</span><b style="font-size:16px">${f(average)}</b></div>
            <div class="home-stat"><span>Sotilgan mahsulotlar</span><b>${soldQty} ta</b></div>
          </div>
        </div>
        <div class="stat">
          <h3 class="gold" style="margin-top:0">Bo‘limlar bo‘yicha sotuv — aylana grafik</h3>
          <p style="color:#d8c29d;font-size:12px">To‘langan buyurtmalardagi taomlar soni bo‘yicha hisoblanadi.</p>
          ${donutMarkup(categoryRows,'Hozircha bo‘limlar bo‘yicha sotuv yo‘q.')}
        </div>
        <div class="stat">
          <h3 class="gold" style="margin-top:0">Tanlangan bo‘lim ichidagi taomlar</h3>
          <select onchange="setStatsCategory(this.value)"><option value="all" ${statsCatFilter==='all'?'selected':''}>Barcha bo‘limlar</option>${categoryOptions}</select>
          ${selectedCategory?donutMarkup(selectedDishes,'Bu bo‘limda hozircha sotuv yo‘q.'):'<p style="color:#d8c29d;font-size:12px">Grafikni ko‘rish uchun menyu bo‘limini tanlang.</p>'}
        </div>
        <div class="stat">
          <h3 class="gold" style="margin-top:0">Eng ko‘p sotilgan taomlar</h3>
          ${topDishes.length ? tbl(['Taom nomi','Soni','Savdo'],topDishes.map(([name,v])=>[name,v.qty+' ta',f(v.sum)])) : '<p style="color:#c0b5a3">Hozircha to‘langan savdo yo‘q.</p>'}
        </div>
        <div class="stat">
          <h3 class="gold" style="margin-top:0">Ofitsiantlar bo‘yicha savdo</h3>
          ${waiterRows.length ? tbl(['Ofitsiant','Cheklar','Savdo'],waiterRows.map(([name,v])=>[name,v.count+' ta',f(v.sum)])) : '<p style="color:#c0b5a3">Ma’lumot yo‘q.</p>'}
        </div>
        <div class="stat">
          <h3 class="gold" style="margin-top:0">Kunlar bo‘yicha tushum</h3>
          ${dayRows.length ? tbl(['Sana','Cheklar','Tushum','Hisobot'],dayRows.map(([date,v])=>{const [d,m,y]=date.split('.');const dateKey=y+'-'+m.padStart(2,'0')+'-'+d.padStart(2,'0');return [date,v.count+' ta',f(v.sum),'<button class="btn sm" onclick="printDailyReport(\\''+dateKey+'\\')">🖨 Print</button>'];})) : '<p style="color:#c0b5a3">Ma’lumot yo‘q.</p>'}
        </div>
        <div class="stat">
          <h3 class="gold" style="margin-top:0">Buyurtmalar holati</h3>
          ${tbl(['Ko‘rsatkich','Soni'],[['Jami buyurtma',all.length+' ta'],['To‘langan',paid.length+' ta'],['To‘lov kutilmoqda',pending.length+' ta'],['Ofitsiantlar', (D.waiters||[]).length+' ta'],['Menyudagi taomlar',(D.menu||[]).length+' ta'],['Bo‘limlar',(D.cats||[]).length+' ta']])}
        </div>
        <div class="stat">
          <button class="btn red" style="width:100%" onclick="clearStats()">Statistikani noldan boshlash</button>
          <p style="color:#d8c29d;font-size:11px">Bu amal buyurtmalarni o‘chirmaydi — faqat yangi hisobot davrini boshlaydi.</p>
        </div>
      `;
    }

    async function printDailyReport(dateKey) {
      if (!dateKey) return alert('Hisobot sanasi topilmadi');
      if (!confirm(dateKey + ' kungi hisobotni printerdan chiqarasizmi?')) return;
      try {
        const result = await api('/api/admin/print-daily-report', 'POST', { date: dateKey });
        alert(result.message || 'Kunlik hisobot printerga yuborildi.');
      } catch (e) {
        alert('Hisobot chop etilmadi: ' + (e.message || e));
      }
    }

    async function clearStats() {
      if (!confirm('Yangi statistika davrini boshlaysizmi? Eski buyurtmalar tarixi saqlanadi, faqat hisobot yangi davrdan hisoblanadi.')) return;
      const result = await api('/api/admin/reset-stats', 'POST', {});
      if (!result.ok) return alert(result.error || 'Tozalash amalga oshmadi');
      await load();
      alert('Yangi statistika davri boshlandi. Eski buyurtmalar tarixi saqlanib qoldi!');
    }

    load();
    setInterval(() => {
      if (P) load(true).catch(() => {});
    }, 5000);
  </script>
</body>
</html>
