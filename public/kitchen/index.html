<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ORZU — Oshxona</title>
<style>
:root{color-scheme:dark;--bg:#101112;--panel:#1c1e20;--line:#393b3e;--gold:#e7c77d;--muted:#aaa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f5f2ea;font:16px Arial,sans-serif}
header{position:sticky;top:0;background:#171819;border-bottom:1px solid var(--line);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;z-index:2}
h1{font-size:21px;margin:0;color:var(--gold)}small{color:var(--muted)}
main{padding:16px;max-width:1500px;margin:auto}.login{max-width:390px;margin:10vh auto;background:var(--panel);padding:24px;border:1px solid var(--line);border-radius:14px}
input,button{font:inherit;border-radius:9px;border:1px solid var(--line);padding:12px;background:#26292b;color:white}
input{width:100%;margin:12px 0}button{cursor:pointer;font-weight:700}button:disabled{opacity:.5;cursor:wait}
.primary{background:#80632b;border-color:#a98b4f}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
.ticket{background:var(--panel);border:1px solid var(--line);border-radius:13px;overflow:hidden}
.ticket-head{padding:14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.table{font-size:23px;font-weight:800;color:var(--gold)}.item{padding:14px;border-bottom:1px solid #303235}.item:last-child{border:0}
.item-name{font-size:18px;font-weight:700}.qty{color:var(--gold);font-size:20px;font-weight:800;margin-left:8px}
.actions{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}.actions button{padding:9px 10px;font-size:13px}
.active{outline:2px solid var(--gold)}.status{font-size:12px;color:var(--muted);margin-top:5px}
.empty{text-align:center;padding:60px 15px;color:var(--muted);background:var(--panel);border-radius:12px}
.stats{display:flex;gap:8px;flex-wrap:wrap}.pill{padding:7px 10px;border-radius:20px;background:#282a2c;color:#ddd;font-size:13px}
@media(max-width:500px){main{padding:10px}.grid{grid-template-columns:1fr}header{padding:12px}h1{font-size:18px}}
</style>
</head>
<body>
<header><div><h1>ORZU · OSHXONA</h1><small id="updated">Buyurtmalar yuklanmoqda…</small></div><button onclick="load()">↻ Yangilash</button></header>
<main>
<section id="login" class="login" hidden><h2 style="color:var(--gold);margin-top:0">Oshxona tizimiga kirish</h2><p><small>Oshxona parolini kiriting.</small></p><input id="pass" type="password" placeholder="Parol"><button class="primary" style="width:100%" onclick="login()">Kirish</button><p id="error" style="color:#ff9b91"></p></section>
<section id="board"><div class="stats" id="stats"></div><div style="height:14px"></div><div id="tickets" class="grid"></div></section>
</main>
<script>
let secret=localStorage.getItem('orzu-kitchen-pass')||'', busy=false;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function headers(){return {'Content-Type':'application/json','x-kitchen':btoa(unescape(encodeURIComponent(secret)))}}
async function api(url,method='GET',body){const r=await fetch(url,{method,headers:headers(),body:body?JSON.stringify(body):undefined});const j=await r.json();if(r.status===401)throw Error('Parol noto‘g‘ri');if(!r.ok)throw Error(j.error||'Xatolik');return j}
function showLogin(message=''){document.getElementById('login').hidden=false;document.getElementById('board').hidden=true;document.getElementById('error').textContent=message}
async function login(){secret=document.getElementById('pass').value;try{await api('/api/kitchen/orders');localStorage.setItem('orzu-kitchen-pass',secret);document.getElementById('login').hidden=true;document.getElementById('board').hidden=false;load()}catch(e){showLogin(e.message)}}
function label(s){return ({new:'Yangi',preparing:'Tayyorlanmoqda',ready:'Tayyor',served:'Berildi'})[s]||s}
function next(s){return ({new:'preparing',preparing:'ready',ready:'served',served:'new'})[s]||'preparing'}
function render(data){
 const orders=data.orders||[], counts={new:0,preparing:0,ready:0,served:0};
 orders.forEach(o=>o.items.forEach(i=>counts[i.kitchenStatus||'new']++));
 document.getElementById('stats').innerHTML=Object.entries(counts).map(([k,v])=>'<span class="pill">'+label(k)+': <b>'+v+'</b></span>').join('');
 document.getElementById('tickets').innerHTML=orders.length?orders.map(o=>'<article class="ticket"><div class="ticket-head"><div><div class="table">STOL '+esc(o.table)+'</div><small>#'+esc(o.id)+' · '+esc(o.waiterName||'Ofitsiant')+'</small></div><div style="text-align:right"><b>'+new Date(o.time).toLocaleTimeString('uz-UZ',{hour:'2-digit',minute:'2-digit'})+'</b><div class="status">'+(o.status==='new'?'Yangi zakaz':'Buyurtma')+'</div></div></div>'+o.items.map(i=>{const st=i.kitchenStatus||'new';return '<div class="item"><div><span class="item-name">'+esc(i.name)+'</span><span class="qty">× '+esc(i.qty)+'</span></div><div class="status">Holati: '+label(st)+'</div><div class="actions"><button class="'+(st==='new'?'primary':'')+'" '+(busy?'disabled':'')+' onclick="setStatus('+o.id+','+i.index+',\''+next(st)+'\')">'+({new:'▶ Tayyorlash',preparing:'✓ Tayyor',ready:'🍽 Berildi',served:'↺ Qayta ochish'}[st])+'</button></div></div>'}).join('')+'</article>').join(''):'<div class="empty">Hozircha oshxonada faol buyurtma yo‘q.<br><small>Yangi zakaz kelganda shu yerda ko‘rinadi.</small></div>';
 document.getElementById('updated').textContent='Oxirgi yangilanish: '+new Date().toLocaleTimeString('uz-UZ');
}
async function load(){if(busy)return;try{const data=await api('/api/kitchen/orders');render(data)}catch(e){if(e.message==='Parol noto‘g‘ri'){localStorage.removeItem('orzu-kitchen-pass');secret='';showLogin(e.message)}else document.getElementById('updated').textContent=e.message}}
async function setStatus(orderId,itemIndex,status){if(busy)return;busy=true;try{await api('/api/kitchen/item-status','POST',{orderId,itemIndex,status});await load()}catch(e){alert(e.message)}finally{busy=false}}
document.getElementById('pass').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
if(secret){document.getElementById('board').hidden=false;load()}else showLogin();
setInterval(load,4000);
</script>
</body></html>
