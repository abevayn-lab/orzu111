<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101112"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>ORZU — Ishlab chiqarish</title>
<style>
:root{color-scheme:dark;--bg:#101112;--panel:#1c1e20;--line:#393b3e;--gold:#e7c77d;--muted:#aaa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f5f2ea;font:16px Arial,sans-serif}header{position:sticky;top:0;background:#171819;border-bottom:1px solid var(--line);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:2}h1{font-size:20px;margin:0;color:var(--gold)}small{color:var(--muted)}main{padding:12px;max-width:1000px;margin:auto}.login{max-width:390px;margin:12vh auto;background:var(--panel);padding:22px;border:1px solid var(--line);border-radius:14px}input,button{font:inherit;border-radius:9px;border:1px solid var(--line);padding:12px;background:#26292b;color:white}input{width:100%;margin:12px 0}button{cursor:pointer;font-weight:700}.primary{background:#80632b;border-color:#a98b4f}.tools{display:flex;gap:7px;align-items:center;justify-content:flex-end;flex-wrap:wrap}.tools button{font-size:13px;padding:10px 11px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px}.ticket{background:var(--panel);border:1px solid var(--line);border-radius:13px;overflow:hidden}.head{padding:13px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.table{font-size:24px;font-weight:800;color:var(--gold)}.item{padding:14px;border-bottom:1px solid #303235}.item:last-child{border:0}.name{font-size:18px;font-weight:700}.qty{color:var(--gold);font-size:21px;font-weight:800;margin-left:8px}.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1;padding:12px 7px;font-size:14px;min-height:46px}.status{font-size:13px;color:var(--muted);margin-top:6px}.empty{text-align:center;padding:55px 15px;color:var(--muted);background:var(--panel);border-radius:12px}.hint{padding:10px 12px;margin-bottom:12px;border:1px solid var(--line);border-radius:10px;color:var(--muted);font-size:13px}@media(max-width:560px){header{align-items:flex-start;flex-direction:column;padding:12px}.tools{width:100%;justify-content:stretch}.tools button{flex:1;min-width:0;font-size:12px;padding:10px 5px}h1{font-size:17px}main{padding:10px}.login{margin:8vh auto}.table{font-size:22px}}
</style></head><body><header><div><h1 id="heading">ORZU · ISH JOYI</h1><small id="updated">Buyurtmalar yuklanmoqda…</small></div><div class="tools"><button id="soundBtn" class="primary" onclick="enableSound()">🔔 Ovozni yoqish</button><button id="installBtn" onclick="installApp()" hidden>📲 Ilova qilib o‘rnatish</button><button onclick="load()">↻ Yangilash</button></div></header>
<main><div class="hint">Yangi zakaz kelganda signal eshitish uchun «Ovozni yoqish» tugmasini bosing. Android’da ilova qilib o‘rnatish uchun yuqoridagi tugmadan foydalaning.</div><section id="login" class="login" hidden><h2 style="color:var(--gold);margin-top:0">Xodim kirishi</h2><p><small>Shaxsiy bo‘lim parolini kiriting.</small></p><input id="pass" type="password" placeholder="Parol"><button class="primary" style="width:100%" onclick="login()">Kirish</button><p id="error" style="color:#ff9b91"></p></section><section id="board"><div id="tickets" class="grid"></div></section></main>
<script>
const station=location.pathname.split('/').filter(Boolean)[0]||'oshpaz';const names={somsachi:'SOMSACHI',salatchi:'SALATCHI',oshpaz:'OSHXONA · OSHPAZ'};document.getElementById('heading').textContent='ORZU · '+(names[station]||'ISH JOYI');let secret=localStorage.getItem('orzu-station-'+station)||'',busy=false,audioContext=null,soundReady=false,seenInitialized=false,seenItems=new Set(),installPrompt=null;const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));function headers(){return {'Content-Type':'application/json','x-station':btoa(unescape(encodeURIComponent(secret)))}}async function api(url,method='GET',body){const r=await fetch(url,{method,headers:headers(),body:body?JSON.stringify(body):undefined});const j=await r.json();if(r.status===401)throw Error(j.error||'Parol noto‘g‘ri');if(!r.ok)throw Error(j.error||'Xatolik');return j}function showLogin(msg=''){document.getElementById('login').hidden=false;document.getElementById('board').hidden=true;document.getElementById('error').textContent=msg}async function login(){secret=document.getElementById('pass').value;try{await api('/api/station/orders?station='+station);localStorage.setItem('orzu-station-'+station,secret);document.getElementById('login').hidden=true;document.getElementById('board').hidden=false;seenInitialized=false;load()}catch(e){showLogin(e.message)}}function label(s){return({new:'Yangi',preparing:'Tayyorlanmoqda',ready:'Tayyor',served:'Berildi'})[s]||s}function next(s){return({new:'preparing',preparing:'ready',ready:'served',served:'new'})[s]||'preparing'}function beep(){if(!soundReady||!audioContext)return;try{const now=audioContext.currentTime;[0,0.23].forEach((delay,n)=>{const osc=audioContext.createOscillator(),gain=audioContext.createGain();osc.type='sine';osc.frequency.value=n?1046:784;gain.gain.setValueAtTime(0.0001,now+delay);gain.gain.exponentialRampToValueAtTime(0.22,now+delay+0.025);gain.gain.exponentialRampToValueAtTime(0.0001,now+delay+0.19);osc.connect(gain);gain.connect(audioContext.destination);osc.start(now+delay);osc.stop(now+delay+0.2)})}catch(e){}}async function enableSound(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC){alert('Bu brauzerda ovoz qo‘llab-quvvatlanmaydi.');return}audioContext=audioContext||new AC();await audioContext.resume();soundReady=true;beep();document.getElementById('soundBtn').textContent='🔔 Ovoz yoqildi';document.getElementById('soundBtn').classList.remove('primary');if('Notification'in window&&Notification.permission==='default'){try{await Notification.requestPermission()}catch(e){}}}catch(e){alert('Ovozni yoqib bo‘lmadi. Telefon ovozini tekshiring.')}}function announceNew(items){if(!items.length)return;if(soundReady)beep();if('Notification'in window&&Notification.permission==='granted'&&document.hidden){const title='ORZU · '+(names[station]||'ISH JOYI');const body=items.length+' ta yangi taom buyurtma qilindi';if(navigator.serviceWorker?.controller){navigator.serviceWorker.ready.then(r=>r.showNotification(title,{body,icon:'/station/icon.svg',badge:'/station/icon.svg',tag:'orzu-'+station+'-'+Date.now()',renotify:true})).catch(()=>{})}else{try{new Notification(title,{body,icon:'/station/icon.svg'})}catch(e){}}}}function render(data){const orders=data.orders||[],current=new Set(),fresh=[];orders.forEach(o=>(o.items||[]).forEach(i=>{const k=String(o.id)+':'+String(i.index);current.add(k);if((i.kitchenStatus||'new')==='new'&&seenInitialized&&!seenItems.has(k))fresh.push(i.name+' × '+i.qty)}));if(seenInitialized&&fresh.length)announceNew(fresh);seenItems=current;seenInitialized=true;document.getElementById('tickets').innerHTML=orders.length?orders.map(o=>'<article class="ticket"><div class="head"><div><div class="table">STOL '+esc(o.table)+'</div><small>#'+esc(o.id)+' · '+esc(o.waiterName||'Ofitsiant')+'</small></div><b>'+new Date(o.time).toLocaleTimeString('uz-UZ',{hour:'2-digit',minute:'2-digit'})+'</b></div>'+o.items.map(i=>{const st=i.kitchenStatus||'new';return '<div class="item"><span class="name">'+esc(i.name)+'</span><span class="qty">× '+esc(i.qty)+'</span><div class="status">Holati: '+label(st)+'</div><div class="actions"><button class="primary" '+(busy?'disabled':'')+' onclick="setStatus('+o.id+','+i.index+',\\''+next(st)+'\\')">'+({new:'▶ Tayyorlash',preparing:'✓ Tayyor',ready:'🍽 Berildi',served:'↺ Qayta ochish'}[st])+'</button></div></div>'}).join('')+'</article>').join(''):'<div class="empty">Hozircha yangi buyurtma yo‘q.<br><small>O‘zingizga tegishli taomlar kelishi bilan shu yerda chiqadi.</small></div>';document.getElementById('updated').textContent='Yangilandi: '+new Date().toLocaleTimeString('uz-UZ')}async function load(){if(busy)return;try{render(await api('/api/station/orders?station='+station))}catch(e){if(/Parol|bo‘lim/.test(e.message)){localStorage.removeItem('orzu-station-'+station);secret='';showLogin(e.message)}else document.getElementById('updated').textContent=e.message}}async function setStatus(orderId,itemIndex,status){if(busy)return;busy=true;try{await api('/api/station/item-status','POST',{station,orderId,itemIndex,status})}catch(e){alert(e.message)}finally{busy=false;await load()}}async function installApp(){if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;document.getElementById('installBtn').hidden=true}else{alert('Chrome menyusini oching va «Ilovani o‘rnatish» yoki «Bosh ekranga qo‘shish»ni tanlang.')}}window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;document.getElementById('installBtn').hidden=false});window.addEventListener('appinstalled',()=>{document.getElementById('installBtn').hidden=true});document.getElementById('pass').addEventListener('keydown',e=>{if(e.key==='Enter')login()});if('serviceWorker'in navigator)navigator.serviceWorker.register('/station/sw.js').catch(()=>{});if(secret){document.getElementById('board').hidden=false;load()}else showLogin();setInterval(load,3500);
</script></body></html>
