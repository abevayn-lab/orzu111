<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101112"><link rel="manifest" id="appManifest"><link rel="icon" href="/station/icon.svg" type="image/svg+xml"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>ORZU — Ishlab chiqarish</title>
<style>
:root{color-scheme:dark;--bg:#101112;--panel:#1c1e20;--line:#393b3e;--gold:#e7c77d;--muted:#aaa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f5f2ea;font:16px Arial,sans-serif}header{position:sticky;top:0;background:#171819;border-bottom:1px solid var(--line);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:2}h1{font-size:20px;margin:0;color:var(--gold)}small{color:var(--muted)}main{padding:12px;max-width:1000px;margin:auto}.login{max-width:390px;margin:12vh auto;background:var(--panel);padding:22px;border:1px solid var(--line);border-radius:14px}input,button{font:inherit;border-radius:9px;border:1px solid var(--line);padding:12px;background:#26292b;color:white}input{width:100%;margin:12px 0}button{cursor:pointer;font-weight:700}.primary{background:#80632b;border-color:#a98b4f}.tools{display:flex;gap:7px;align-items:center;justify-content:flex-end;flex-wrap:wrap}.tools button{font-size:13px;padding:10px 11px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px}.ticket{background:var(--panel);border:1px solid var(--line);border-radius:13px;overflow:hidden}.head{padding:13px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.table{font-size:24px;font-weight:800;color:var(--gold)}.item{padding:14px;border-bottom:1px solid #303235}.item:last-child{border:0}.name{font-size:18px;font-weight:700}.qty{color:var(--gold);font-size:21px;font-weight:800;margin-left:8px}.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1;padding:12px 7px;font-size:14px;min-height:46px}.status{font-size:13px;color:var(--muted);margin-top:6px}.empty{text-align:center;padding:55px 15px;color:var(--muted);background:var(--panel);border-radius:12px}.hint{padding:10px 12px;margin-bottom:12px;border:1px solid var(--line);border-radius:10px;color:var(--muted);font-size:13px}@media(max-width:560px){header{align-items:flex-start;flex-direction:column;padding:12px}.tools{width:100%;justify-content:stretch}.tools button{flex:1;min-width:0;font-size:12px;padding:10px 5px}h1{font-size:17px}main{padding:10px}.login{margin:8vh auto}.table{font-size:22px}}

    /* Native-app feel: prevent accidental double-tap/pinch zoom and rubber-band page drift. */
    html { touch-action: pan-y manipulation; overscroll-behavior-y: none; -webkit-text-size-adjust: 100%; }
    body { overscroll-behavior-y: none; }
    button, a, input, select, textarea { touch-action: manipulation; }
  </style></head><body><header><div><h1 id="heading">ORZU · ISH JOYI</h1><small id="updated">Buyurtmalar yuklanmoqda…</small></div><div class="tools"><button id="alertsBtn" class="primary" onclick="enableAlerts()">🔔 Bildirishnomani yoqish</button><button id="soundBtn" onclick="enableSound()">🔊 Ovoz sinovi</button><button id="installBtn" onclick="installApp()" hidden>📲 Ilova qilib o‘rnatish</button><button onclick="load()">↻ Yangilash</button><button onclick="closeDay()">🌙 Kunlik yopish</button></div></header>
<main><div class="hint">Telefon tepasiga zakaz xabari chiqishi uchun «Bildirishnomani yoqish» tugmasini bosing. Ilova yopiq bo‘lsa ham Web Push xabari kelishi mumkin — telefon va brauzer ruxsatlari yoqilgan bo‘lishi kerak.</div><section id="login" class="login" hidden><h2 style="color:var(--gold);margin-top:0">Xodim kirishi</h2><p><small>Shaxsiy bo‘lim parolini kiriting.</small></p><input id="pass" type="password" placeholder="Parol"><button class="primary" style="width:100%" onclick="login()">Kirish</button><p id="error" style="color:#ff9b91"></p></section><section id="board"><div id="tickets" class="grid"></div></section></main>
<script>
const station=location.pathname.split('/').filter(Boolean)[0]||'oshpaz';const manifestLink=document.getElementById('appManifest');if(manifestLink)manifestLink.href='/station/manifest-'+station+'.webmanifest';const names={somsachi:'SOMSACHI',salatchi:'SALATCHI',oshpaz:'OSHXONA · OSHPAZ'};document.getElementById('heading').textContent='ORZU · '+(names[station]||'ISH JOYI');let secret=localStorage.getItem('orzu-station-'+station)||'',busy=false,audioContext=null,soundReady=false,seenInitialized=false,seenItems=new Set(),installPrompt=null;const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));function headers(){return {'Content-Type':'application/json','x-station':btoa(unescape(encodeURIComponent(secret)))}}async function api(url,method='GET',body){const r=await fetch(url,{method,cache:'no-store',headers:headers(),body:body?JSON.stringify(body):undefined});const j=await r.json();if(r.status===401)throw Error(j.error||'Parol noto‘g‘ri');if(!r.ok)throw Error(j.error||'Xatolik');return j}function showLogin(msg=''){document.getElementById('login').hidden=false;document.getElementById('board').hidden=true;document.getElementById('error').textContent=msg}async function login(){secret=document.getElementById('pass').value;try{await api('/api/station/orders?station='+station);localStorage.setItem('orzu-station-'+station,secret);document.getElementById('login').hidden=true;document.getElementById('board').hidden=false;seenInitialized=false;load()}catch(e){showLogin(e.message)}}function label(s){return({new:'Yangi',preparing:'Tayyorlanmoqda',ready:'Tayyor',served:'Berildi'})[s]||s}function next(s){return({new:'preparing',preparing:'ready',ready:'served',served:'new'})[s]||'preparing'}function beep(){if(!soundReady||!audioContext)return;try{const now=audioContext.currentTime;const master=audioContext.createGain();master.gain.setValueAtTime(0.0001,now);master.gain.exponentialRampToValueAtTime(0.92,now+0.035);master.gain.setValueAtTime(0.92,now+0.28);master.gain.exponentialRampToValueAtTime(0.0001,now+0.78);master.connect(audioContext.destination);[520,780,1040].forEach((frequency,index)=>{const osc=audioContext.createOscillator(),gain=audioContext.createGain();osc.type='sine';osc.frequency.value=frequency;gain.gain.value=index===0?1:index===1?0.42:0.16;osc.connect(gain);gain.connect(master);osc.start(now);osc.stop(now+0.8)})}catch(e){}}async function unlockAudio(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!audioContext||audioContext.state==='closed')audioContext=new AC();if(audioContext.state!=='running')await audioContext.resume();soundReady=audioContext.state==='running';if(soundReady)beep()}
function base64UrlToBytes(value){const pad='='.repeat((4-value.length%4)%4);const raw=atob((value+pad).replace(/-/g,'+').replace(/_/g,'/'));const out=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i);return out}
async function subscribePush(){if(!('serviceWorker'in navigator)||!('PushManager'in window)||!('Notification'in window))throw Error('Bu brauzer push bildirishnomasini qo‘llamaydi');if(Notification.permission!=='granted')throw Error('Telefon sozlamalarida bildirishnomaga ruxsat bering');const registration=await navigator.serviceWorker.register('/sw.js');await navigator.serviceWorker.ready;const keyResponse=await fetch('/api/push/public-key',{cache:'no-store'});const keyData=await keyResponse.json();if(!keyData.enabled||!keyData.publicKey)throw Error('Serverda push kalitlari sozlanmagan');let subscription=await registration.pushManager.getSubscription();if(!subscription)subscription=await registration.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:base64UrlToBytes(keyData.publicKey)});await api('/api/push/subscribe','POST',{station,subscription:subscription.toJSON()});const btn=document.getElementById('alertsBtn');btn.textContent='🔔 Bildirishnomalar yoqildi';btn.classList.remove('primary')}
async function enableAlerts(){if(!secret){alert('Avval xodim paroli bilan kiring.');document.getElementById('pass').focus();return}const btn=document.getElementById('alertsBtn');btn.disabled=true;try{let permission=Notification.permission;if(permission==='default')permission=await Notification.requestPermission();if(permission!=='granted')throw Error('Bildirishnomaga ruxsat berilmadi. Telefon sozlamalaridan ORZU uchun ruxsatni yoqing.');try{await unlockAudio()}catch(_){}await subscribePush();alert('Bildirishnoma yoqildi. Ilovadan chiqib ketsangiz ham yangi zakaz xabari telefon tepasiga kelishi mumkin. Telefon sozlamalarida ORZU bildirishnoma ovozini o‘chirmang.')}catch(e){alert(e.message||'Bildirishnoma sozlanmadi')}finally{btn.disabled=false}}
async function enableSound(){try{await unlockAudio();document.getElementById('soundBtn').textContent='🔊 Ovoz yoqildi'}catch(e){soundReady=false;alert('Telefon brauzeri ovozni ishga tushira olmadi. Chrome’da ochib, media ovozini ko‘taring va qayta urinib ko‘ring.')}}
function announceNew(items){if(!items.length)return;if(soundReady)beep();if('Notification'in window&&Notification.permission==='granted'&&document.hidden){navigator.serviceWorker.ready.then(r=>r.showNotification('ORZU · '+(names[station]||'ISH JOYI'),{body:items.join(', '),icon:'/station/icon.svg',badge:'/station/icon.svg',tag:'orzu-'+station+'-'+Date.now(),renotify:true,requireInteraction:true,vibrate:[850],data:{url:'/'+station}})).catch(()=>{})}}function render(data){const orders=(data.orders||[]).slice().sort((a,b)=>{const ta=Date.parse(a.time)||Number(a.id)||0,tb=Date.parse(b.time)||Number(b.id)||0;return tb-ta}),current=new Set(),fresh=[];orders.forEach(o=>(o.items||[]).forEach(i=>{const k=String(o.id)+':'+String(i.index);current.add(k);if((i.kitchenStatus||'new')==='new'&&seenInitialized&&!seenItems.has(k))fresh.push(i.name+' × '+i.qty)}));if(seenInitialized&&fresh.length)announceNew(fresh);seenItems=current;seenInitialized=true;document.getElementById('tickets').innerHTML=orders.length?orders.map(o=>'<article class="ticket"><div class="head"><div><div class="table">STOL '+esc(o.table)+'</div><small>#'+esc(o.id)+' · '+esc(o.waiterName||'Ofitsiant')+'</small></div><b>'+new Date(o.time).toLocaleTimeString('uz-UZ',{hour:'2-digit',minute:'2-digit'})+'</b></div>'+o.items.map(i=>{const st=i.kitchenStatus||'new';return '<div class="item"><div style="display:flex;align-items:center;gap:10px">'+(i.img?'<img src="'+esc(i.img)+'" alt="" style="width:68px;height:68px;object-fit:cover;border-radius:10px;flex-shrink:0" onerror="this.style.display=\'none\'">':'')+'<div><span class="name">'+esc(i.name)+'</span><span class="qty">× '+esc(i.qty)+'</span></div></div><div class="status">Holati: '+label(st)+'</div></div>'}).join('')+'</article>').join(''):'<div class="empty">Hozircha yangi buyurtma yo‘q.<br><small>O‘zingizga tegishli taomlar kelishi bilan shu yerda chiqadi.</small></div>';document.getElementById('updated').textContent='Yangilandi: '+new Date().toLocaleTimeString('uz-UZ')}async function load(){if(busy)return;try{render(await api('/api/station/orders?station='+station))}catch(e){if(/Parol|bo‘lim/.test(e.message)){localStorage.removeItem('orzu-station-'+station);secret='';showLogin(e.message)}else document.getElementById('updated').textContent=e.message}}async function setStatus(orderId,itemIndex,status){if(busy)return;busy=true;try{await api('/api/station/item-status','POST',{station,orderId,itemIndex,status})}catch(e){alert(e.message)}finally{busy=false;await load()}}async function closeDay(){if(busy)return;if(!confirm('Bugungi '+(names[station]||'ish joyi')+' ishini yopasizmi? Ekrandagi bugungi buyurtmalar yashiriladi, buyurtmalar tarixi va kassadagi ma’lumotlar saqlanadi.'))return;busy=true;try{const d=await api('/api/station/close-day','POST',{station});seenItems.clear();seenInitialized=false;await load();alert('Kun yopildi. '+(d.summary?.items||0)+' turdagi taom, '+(d.summary?.quantity||0)+' porsiya hisobga olindi. Tarix saqlandi.')}catch(e){alert('Kun yopilmadi: '+e.message)}finally{busy=false;}}async function installApp(){if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;document.getElementById('installBtn').hidden=true}else{alert('Chrome menyusini oching va «Ilovani o‘rnatish» yoki «Bosh ekranga qo‘shish»ni tanlang.')}}window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;document.getElementById('installBtn').hidden=false});window.addEventListener('appinstalled',()=>{document.getElementById('installBtn').hidden=true});document.getElementById('pass').addEventListener('keydown',e=>{if(e.key==='Enter')login()});if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});if('Notification'in window&&Notification.permission==='granted'&&secret)document.getElementById('alertsBtn').textContent='🔔 Ruxsatni tekshirish';if(secret){document.getElementById('board').hidden=false;load()}else showLogin();setInterval(load,1400);
</script><script>
(function(){
  const stopZoom = e => { if (e.cancelable) e.preventDefault(); };
  document.addEventListener('gesturestart', stopZoom, {passive:false});
  document.addEventListener('gesturechange', stopZoom, {passive:false});
  document.addEventListener('gestureend', stopZoom, {passive:false});
  document.addEventListener('dblclick', stopZoom, {passive:false});
})();
</script>
</body></html>
