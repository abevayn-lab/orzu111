<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101112"><title>ORZU — Ishlab chiqarish</title>
<style>
:root{color-scheme:dark;--bg:#101112;--panel:#1c1e20;--line:#393b3e;--gold:#e7c77d;--muted:#aaa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f5f2ea;font:16px Arial,sans-serif}header{position:sticky;top:0;background:#171819;border-bottom:1px solid var(--line);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;z-index:2}h1{font-size:20px;margin:0;color:var(--gold)}small{color:var(--muted)}main{padding:12px;max-width:1000px;margin:auto}.login{max-width:390px;margin:12vh auto;background:var(--panel);padding:22px;border:1px solid var(--line);border-radius:14px}input,button{font:inherit;border-radius:9px;border:1px solid var(--line);padding:12px;background:#26292b;color:white}input{width:100%;margin:12px 0}button{cursor:pointer;font-weight:700}.primary{background:#80632b;border-color:#a98b4f}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.ticket{background:var(--panel);border:1px solid var(--line);border-radius:13px;overflow:hidden}.head{padding:13px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.table{font-size:24px;font-weight:800;color:var(--gold)}.item{padding:14px;border-bottom:1px solid #303235}.item:last-child{border:0}.name{font-size:18px;font-weight:700}.qty{color:var(--gold);font-size:21px;font-weight:800;margin-left:8px}.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1;padding:11px 7px;font-size:14px}.status{font-size:13px;color:var(--muted);margin-top:6px}.empty{text-align:center;padding:55px 15px;color:var(--muted);background:var(--panel);border-radius:12px}@media(max-width:500px){header{padding:12px}h1{font-size:17px}}
</style></head><body><header><div><h1 id="heading">ORZU · ISH JOYI</h1><small id="updated">Buyurtmalar yuklanmoqda…</small></div><button onclick="load()">↻</button></header>
<main><section id="login" class="login" hidden><h2 style="color:var(--gold);margin-top:0">Xodim kirishi</h2><p><small>Shaxsiy bo‘lim parolini kiriting.</small></p><input id="pass" type="password" placeholder="Parol"><button class="primary" style="width:100%" onclick="login()">Kirish</button><p id="error" style="color:#ff9b91"></p></section><section id="board"><div id="tickets" class="grid"></div></section></main>
<script>
const station=location.pathname.split('/').filter(Boolean)[0]||'oshpaz';const names={somsachi:'SOMSACHI',salatchi:'SALATCHI',oshpaz:'OSHXONA · OSHPAZ'};document.getElementById('heading').textContent='ORZU · '+(names[station]||'ISH JOYI');let secret=localStorage.getItem('orzu-station-'+station)||'',busy=false;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function headers(){return {'Content-Type':'application/json','x-station':btoa(unescape(encodeURIComponent(secret)))}}async function api(url,method='GET',body){const r=await fetch(url,{method,headers:headers(),body:body?JSON.stringify(body):undefined});const j=await r.json();if(r.status===401)throw Error(j.error||'Parol noto‘g‘ri');if(!r.ok)throw Error(j.error||'Xatolik');return j}function showLogin(msg=''){document.getElementById('login').hidden=false;document.getElementById('board').hidden=true;document.getElementById('error').textContent=msg}async function login(){secret=document.getElementById('pass').value;try{await api('/api/station/orders?station='+station);localStorage.setItem('orzu-station-'+station,secret);document.getElementById('login').hidden=true;document.getElementById('board').hidden=false;load()}catch(e){showLogin(e.message)}}function label(s){return({new:'Yangi',preparing:'Tayyorlanmoqda',ready:'Tayyor',served:'Berildi'})[s]||s}function next(s){return({new:'preparing',preparing:'ready',ready:'served',served:'new'})[s]||'preparing'}function render(data){const orders=data.orders||[];document.getElementById('tickets').innerHTML=orders.length?orders.map(o=>'<article class="ticket"><div class="head"><div><div class="table">STOL '+esc(o.table)+'</div><small>#'+esc(o.id)+' · '+esc(o.waiterName||'Ofitsiant')+'</small></div><b>'+new Date(o.time).toLocaleTimeString('uz-UZ',{hour:'2-digit',minute:'2-digit'})+'</b></div>'+o.items.map(i=>{const st=i.kitchenStatus||'new';return '<div class="item"><span class="name">'+esc(i.name)+'</span><span class="qty">× '+esc(i.qty)+'</span><div class="status">Holati: '+label(st)+'</div><div class="actions"><button class="primary" '+(busy?'disabled':'')+' onclick="setStatus('+o.id+','+i.index+',\''+next(st)+'\')">'+({new:'▶ Tayyorlash',preparing:'✓ Tayyor',ready:'🍽 Berildi',served:'↺ Qayta ochish'}[st])+'</button></div></div>'}).join('')+'</article>').join(''):'<div class="empty">Hozircha yangi buyurtma yo‘q.<br><small>O‘zingizga tegishli taomlar kelishi bilan shu yerda chiqadi.</small></div>';document.getElementById('updated').textContent='Yangilandi: '+new Date().toLocaleTimeString('uz-UZ')}async function load(){if(busy)return;try{render(await api('/api/station/orders?station='+station))}catch(e){if(/Parol|bo‘lim/.test(e.message)){localStorage.removeItem('orzu-station-'+station);secret='';showLogin(e.message)}else document.getElementById('updated').textContent=e.message}}async function setStatus(orderId,itemIndex,status){if(busy)return;busy=true;try{await api('/api/station/item-status','POST',{station,orderId,itemIndex,status})}catch(e){alert(e.message)}finally{busy=false;await load()}}document.getElementById('pass').addEventListener('keydown',e=>{if(e.key==='Enter')login()});if(secret){document.getElementById('board').hidden=false;load()}else showLogin();setInterval(load,3500);
</script></body></html>
